name: Build and Release SunPlay IPK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install LG webOS CLI Tools
        run: npm install -g @webos-tools/cli

      - name: Package SunPlay IPK
        run: node package.js

      - name: Upload IPK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: dist/*.ipk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload IPK as Artifact (for manual workflow runs)
        uses: actions/upload-artifact@v4
        with:
          name: com.sunplay.native_all.ipk
          path: dist/*.ipk
